server {
    listen 80;
    listen [::]:80;
    server_name shallowsea.nopeoplestime.info;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/shallowsea/acme;
    }
    location / {
        return 301 https://shallowsea.nopeoplestime.info$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shallowsea.nopeoplestime.info;
    ssl_certificate /etc/letsencrypt/live/shallowsea.nopeoplestime.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shallowsea.nopeoplestime.info/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8019;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
