# 인증서를 받기 전에 쓰는 HTTP 설정. 인증서를 받은 뒤 shallowsea.nginx.conf로 바꾼다.
server {
    listen 80;
    listen [::]:80;
    server_name shallowsea.nopeoplestime.info;
    location ^~ /.well-known/acme-challenge/ {
        root /srv/shallowsea/acme;
    }
    location / {
        proxy_pass http://127.0.0.1:8019;
        proxy_set_header Host $host;
    }
}
